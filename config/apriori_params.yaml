# =====================================================================
# АПРИОРНЫЕ ПАРАМЕТРЫ МОДЕЛИ (по техническим описаниям, Таблица 2.3)
# =====================================================================
model_type: "apriori"

# 1. Фиксированные системные и протокольные параметры (п. 2.3, 2.4, 2.6)
system:
  supply_voltage_v: 3.3           # Напряжение питания обеих цепей U, В
  region: "EU433"                 # Региональный план
  frequency_hz: 433175000         # Обязательный канал EU433 (433.175 МГц)
  bandwidth_khz: 125              # Полоса пропускания BW, кГц
  coding_rate: 1                  # Скорость кода CR = 4/5 (1 -> 4/5, 2 -> 4/6, 3 -> 4/7, 4 -> 4/8)
  preamble_symbols: 8             # Длина преамбулы N_pre, символов
  lorawan_header_bytes: 13        # Служебные поля кадра LoRaWAN, байт (Таблица 2.4)
  explicit_header: true           # Наличие физического заголовка PHDR (H = 0 в формуле Semtech)
  crc_enabled: true               # Контрольная сумма пакета (CRC = 1)
  rx1_delay_ms: 1000.0            # RECEIVE_DELAY1: от конца передачи до открытия RX1, мс
  rx2_delay_ms: 2000.0            # RECEIVE_DELAY2: от конца передачи до открытия RX2, мс (WAIT_RX2 = 2000 - 1000 - T_rx1)
  rx1_dr_offset: 0                # Смещение скорости для окна RX1
  rx2_sf: 12                      # Скорость окна RX2 по умолчанию в EU433 (DR0 -> SF12)
  rx_window_symbols: 8            # Число символов пустого окна приёма N_sym (формула 2.2)

# 2. Параметры класса B (формула 2.5, п. 2.6.1)
class_b:
  beacon_period_s: 128.0          # Период маяка T_b, с
  beacon_window_s: 122.88         # Окно ping-слотов: 4096 слотов по 30 мс (T_ping = 0.96 * 2^k с)
  beacon_sf: 9                   # В плане EU433 маяки передаются на SF9 (125 кГц)
  beacon_rx_duration_ms: 160.0    # Длительность приёма маяка с учётом окна синхронизации, мс
  ping_slot_duration_ms: 30.0     # Длительность открытия одного ping-слота, мс

# 3. Параметры радиоканала и алгоритма ADR (формулы 2.6, 2.7)
channel_adr:
  tx_power_dbm: 10.0              # Выходная мощность передатчика P_tx, дБм
  min_tx_power_dbm: 2.0           # Нижняя граница мощности при ADR (TXPower 5 в EU433: 12.15 - 10 дБм)
  tx_power_step_db: 2.0           # Шаг индекса TXPower в EU433, дБ
  antenna_gain_db: 0.0           # Суммарное усиление антенн G, дБ
  ref_distance_km: 0.05           # Опорное расстояние d_0 (50 м), км
  ref_loss_db: 70.0               # Затухание L_0 на расстоянии d_0, дБ (уточняется в серии С7)
  path_loss_exponent: 2.8         # Показатель затухания gamma (уточняется в серии С7)
  thermal_noise_dbm: -174.0       # Спектральная плотность теплового шума, дБм/Гц
  gateway_noise_figure_db: 6.0    # Коэффициент шума приёмника шлюза NF, дБ
  adr_margin_db: 10.0             # Запас на установку M_adr, дБ (формула 2.7)
  snr_thresholds_db:              # Требуемое отношение сигнал/шум SNR_req по даташиту SX1278 [7]
    7: -7.5
    8: -10.0
    9: -12.5
    10: -15.0
    11: -17.5
    12: -20.0

