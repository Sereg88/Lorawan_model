# =====================================================================
# ОТКАЛИБРОВАННЫЕ ПАРАМЕТРЫ МОДЕЛИ — ШАБЛОН (ЗАГЛУШКА)
# Серии С0–С8 ещё не проведены: значения ниже условные и служат только для
# отладки программы. Их нельзя приводить в отчёте как результаты измерений.
# После каждой серии замените значения измеренными и укажите номер протокола.
# =====================================================================
model_type: "calibrated"
data_status: "placeholder"        # "placeholder" -> "measured" после заполнения по протоколам С0–С8

system:
  supply_voltage_v: 3.3
  region: "EU433"
  frequency_hz: 433175000
  bandwidth_khz: 125
  coding_rate: 1
  preamble_symbols: 8
  lorawan_header_bytes: 13
  explicit_header: true
  crc_enabled: true
  rx1_delay_ms: 1002.5            # Заглушка: от конца TX до RX1 (заменить по осциллограммам С1)
  rx2_delay_ms: 2001.8            # Заглушка: от конца TX до RX2 (заменить по осциллограммам С1)
  rx1_dr_offset: 0
  rx2_sf: 12
  rx_window_symbols: 10           # Заглушка: число символов окна RX (заменить по осциллограммам С1)

class_b:
  beacon_period_s: 128.0
  beacon_window_s: 122.88
  beacon_sf: 9
  beacon_rx_duration_ms: 175.0    # Заглушка (заменить по серии С6)
  ping_slot_duration_ms: 32.5     # Заглушка (заменить по серии С6)

channel_adr:
  tx_power_dbm: 10.0
  min_tx_power_dbm: 2.0
  tx_power_step_db: 2.0
  antenna_gain_db: 0.0
  ref_distance_km: 0.05
  ref_loss_db: 72.4               # Заглушка (определить по RSSI серии С7, fit_path_loss_params)
  path_loss_exponent: 2.95        # Заглушка (определить по RSSI серии С7, fit_path_loss_params)
  thermal_noise_dbm: -174.0
  gateway_noise_figure_db: 6.0
  adr_margin_db: 10.0
  snr_thresholds_db:
    7: -7.5
    8: -10.0
    9: -12.5
    10: -15.0
    11: -17.5
    12: -20.0

